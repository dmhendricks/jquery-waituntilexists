name: Release

on:
    push:
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'
            - 'v[0-9]+.[0-9]+.[0-9]+-*'
    # Manual dry run. Exercises OIDC auth, every guard, and packing —
    # without publishing. Run this before the first real release.
    workflow_dispatch:
        inputs:
            dry_run:
                description: 'Validate without publishing'
                type: boolean
                default: true

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Required for npm Trusted Publishing (OIDC) and build provenance.
            # No NPM_TOKEN secret is stored in this repo.
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - run: npm ci
            - run: npm run lint
            - run: npm run test:types
            - run: npm test
            - run: npm run build

            # dist/ is committed so the jsDelivr GitHub-tag CDN route works.
            # Refuse to publish if the tag's dist/ does not match its src/.
            - name: Verify dist/ is in sync with src/
              run: |
                  if ! git diff --exit-code --stat dist/; then
                    echo "::error::dist/ is stale. Run 'npm run build' and commit before tagging."
                    exit 1
                  fi

            # Skipped on manual runs, where the ref is a branch rather than a tag.
            - name: Verify tag matches package.json version
              if: github.event_name == 'push'
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  PKG=$(node -p "require('./package.json').version")
                  if [ "$TAG" != "$PKG" ]; then
                    echo "::error::Tag $TAG does not match package.json version $PKG"
                    exit 1
                  fi

            - name: Verify the version is not already published
              run: |
                  PKG=$(node -p "require('./package.json').version")
                  NAME=$(node -p "require('./package.json').name")
                  if npm view "$NAME@$PKG" version >/dev/null 2>&1; then
                    echo "::error::$NAME@$PKG is already published. Versions cannot be reused."
                    exit 1
                  fi
                  echo "$NAME@$PKG is unpublished — OK to release."

            # Prereleases (2.0.0-rc.1) go to the `next` dist-tag so they do not
            # become `latest` — unversioned CDN URLs resolve to `latest`.
            - name: Publish
              run: |
                  ARGS="--provenance --access public"
                  if [[ "$GITHUB_REF_NAME" == *-* ]]; then
                    ARGS="$ARGS --tag next"
                  fi

                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "Dry run — validating without publishing."
                    npm publish $ARGS --dry-run
                    echo "Dry run complete. Nothing was published."
                  else
                    npm publish $ARGS
                  fi
